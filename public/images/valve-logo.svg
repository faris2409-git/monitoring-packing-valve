<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Clean Corporate Background Badge -->
  <rect x="6" y="6" width="108" height="108" rx="24" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Minimalist Engine Valve Silhouette -->
  <g fill="#0284c7">
    <!-- Stem Tip & Keeper Groove -->
    <rect x="56" y="22" width="8" height="6" rx="1.5"/>
    <rect x="54" y="29" width="12" height="3" rx="1"/>
    
    <!-- Valve Stem -->
    <rect x="56.5" y="32" width="7" height="42" rx="1"/>
    
    <!-- Neck / Fillet Flare -->
    <path d="M 56.5,74 C 56.5,82 42,85 30,88 L 30,92 C 45,95 75,95 90,92 L 90,88 C 78,85 63.5,82 63.5,74 Z"/>
    
    <!-- Valve Head Disc Bottom Base -->
    <rect x="32" y="92" width="56" height="4" rx="2" fill="#0369a1"/>
  </g>
</svg>
